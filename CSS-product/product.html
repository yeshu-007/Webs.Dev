<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Card</title>
  <link rel="stylesheet" href="prod.css">
</head>
<body>

  <section class="container">
    <div class="card">

      <div class="image">
        <img src="IN-TINTO-BAR-01-1.jpg" alt="Kaju Feni Chocolate Bar">
      </div>

      <div class="info">
        <p class="type">INABO SPECIALS</p>

        <h2>Kaju Feni Chocolate Bar</h2>

        <p class="tagline">70% Dark Chocolate infused with Tinto Cashew Feni</p>
        <p class="description">
          The Tinto Cashew Feni Chocolate Bar is a playful and nostalgic celebration of Goan street life,
          captured in rich dark chocolate and infused with the unmistakable spirit of Tinto Cashew Feni.
        </p>

        <div class="price">
          <h3>₹250</h3>
          <span>₹300</span>
        </div>

        <button class="buybtn">Buy</button>
        <button class="cart-btn">Add to Cart</button>

      </div>
    </div>
  </section>
</body>
</html>
