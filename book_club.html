<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Club Signup</title>
</head>
<body>

<h1>Hey there!! Join Our Book Club!</h1>
<form action="#" method="post">
    
    <p>Full name</p>
    <label for="fullName">Full Name:</label><br>
    <input type="text" id="fullName" name="fullName" required><br><br>

    
    <label for="email">Email Address:</label><br>
    <input type="email" id="email" name="email" required><br><br>

    <p>Favorite Genres:</p>
    <input type="checkbox" id="fiction" name="genres" value="Fiction">
    <label for="fiction">Fiction</label><br>

    <input type="checkbox" id="mystery" name="genres" value="Mystery">
    <label for="mystery">Mystery</label><br>

    <input type="checkbox" id="scifi" name="genres" value="Sci-Fi">
    <label for="scifi">Sci-Fi</label><br>

    <input type="checkbox" id="nonfiction" name="genres" value="Non-Fiction">
    <label for="nonfiction">Non-Fiction</label><br>

    <input type="checkbox" id="others" name="genres" value="Others">
    <label for="others">Others</label><br><br>

    <p>How often do you read?</p>
    <input type="radio" id="daily" name="readingFrequency" value="Daily">
    <label for="daily">Daily</label><br>

    <input type="radio" id="weekly" name="readingFrequency" value="Weekly">
    <label for="weekly">Weekly</label><br>

    <input type="radio" id="occasionally" name="readingFrequency" value="Occasionally">
    <label for="occasionally">Occasionally</label><br><br>

    <label for="author">Favorite Author:</label><br>
    <input type="text" id="author" name="author"><br><br>

    <label for="reason">Why do you love reading?</label><br>
    <textarea id="reason" name="reason" rows="4" cols="50"></textarea><br><br>

    <input type="submit" value="Join Now">

  </form>

</body>
</html>
